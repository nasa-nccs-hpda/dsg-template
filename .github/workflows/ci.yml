name: CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install .
      - name: Test installed package
        run: python -m unittest discover -s tests -v
      - name: Smoke test CLI
        run: dsg-project examples/sample.csv

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build container
        run: docker build -t dsg-project:ci .
      - name: Smoke test container with synthetic data
        run: |
          result=$(docker run --rm --mount type=bind,source="$PWD/examples",target=/data,readonly dsg-project:ci /data/sample.csv)
          test "$result" = '{"columns": ["name", "value"], "rows": 2}'
