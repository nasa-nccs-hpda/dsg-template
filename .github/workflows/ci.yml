name: CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.23"
          enable-cache: true
      - name: Install package
        run: uv sync --locked --no-editable
      - name: Test installed package
        run: uv run --locked --no-editable python -m unittest discover -s tests -v
      - name: Smoke test CLI
        run: uv run --locked --no-editable dsg-project examples/sample.csv

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build container
        run: docker build -t dsg-project:ci .
      - name: Smoke test container with synthetic data
        run: |
          result=$(docker run --rm --mount type=bind,source="$PWD/examples",target=/data,readonly dsg-project:ci /data/sample.csv)
          test "$result" = '{"columns": ["name", "value"], "rows": 2}'
