[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dsg-project-starter"
version = "0.1.0"
description = "Minimal Python starter for a DSG client project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
dsg-project = "dsg_project.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
